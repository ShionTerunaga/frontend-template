name: Create GitHub Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: create-github-release
  cancel-in-progress: true

jobs:
  github-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build release notes from changelogs
        id: notes
        run: node --experimental-strip-types ./scripts/release-notes/extract-release-notes.ts "${{ github.event.before }}" "${{ github.sha }}"

      - name: Create or update GitHub Release
        if: steps.notes.outputs.has_notes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_PATH: ${{ steps.notes.outputs.notes_path }}
          TAG_NAME: ${{ steps.notes.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.notes.outputs.release_name }}
        run: node --experimental-strip-types ./scripts/release-notes/create-github-release.ts
